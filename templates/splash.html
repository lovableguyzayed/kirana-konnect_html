<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirana Konnect - Welcome</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>::-webkit-scrollbar { display: none;}</style>
    
<style>
      body {
        font-family: 'Inter', sans-serif !important;
      }
      
      /* Preserve Font Awesome icons */
      .fa, .fas, .far, .fal, .fab {
        font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
      }
    </style>
<style>
  .highlighted-section {
    outline: 2px solid #3F20FB;
    background-color: rgba(63, 32, 251, 0.1);
  }

  .edit-button {
    position: absolute;
    z-index: 1000;
  }

  ::-webkit-scrollbar {
    display: none;
  }

  html, body {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
    <script src="/static/js/app-ui.js"></script>
    <script src="/static/js/scanner.js" defer></script>
</head>
<body class="font-poppins bg-gradient-to-br from-primary to-green-600 flex items-center justify-center" style="min-height:100vh;padding:24px 0">
    
    <!-- Logo Container -->
    <div id="logo-container" class="text-center px-8">
        <!-- App Logo -->
        <div class="mb-8">
            <div class="w-32 h-32 mx-auto bg-white rounded-3xl shadow-2xl flex items-center justify-center mb-6 transform hover:scale-105 transition-transform duration-300">
                <div class="text-center">
                    <i class="fa-solid fa-store text-primary text-4xl mb-2"></i>
                    <div class="text-primary font-bold text-lg">KC</div>
                </div>
            </div>
            
            <!-- App Name -->
            <h1 class="text-white text-4xl font-bold mb-2">Kirana Konnect</h1>
            <p class="text-white/90 text-lg font-medium mb-6">Complete Store Management Solution</p>
        </div>

        <!-- Store Details Card -->
        <!-- Hidden: showed a made-up shop ("Sharma Kirana Store") and fake GSTIN/Udyam before sign-in. -->
        <div id="store-details" hidden style="display:none" class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 mb-8 border border-white/20">
            <div class="text-white space-y-3">
                <div class="flex items-center justify-center space-x-3">
                    <i class="fa-solid fa-shop text-white/80"></i>
                    <span class="font-semibold text-lg">Sharma Kirana Store</span>
                </div>
                
                <div class="space-y-2 text-sm">
                    <div class="flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-receipt text-white/70 text-xs"></i>
                        <span class="text-white/90">GST: 24ABCDE1234F1Z5</span>
                    </div>
                    
                    <div class="flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-certificate text-white/70 text-xs"></i>
                        <span class="text-white/90">UDYAM: UP-12-0012345</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div id="action-buttons" class="space-y-4">
            <a id="get-started-btn" href="/signup" class="w-full bg-white text-primary font-bold py-4 px-6 rounded-xl shadow-lg flex items-center justify-center space-x-3" style="text-decoration:none">
                <i class="fa-solid fa-store text-xl"></i>
                <span class="text-lg">Create my shop account</span>
            </a>
            <a id="signin-link" href="/signin" class="w-full text-white font-semibold py-4 px-6 rounded-xl flex items-center justify-center space-x-3" style="text-decoration:none;border:2px solid rgba(255,255,255,.7)">
                <i class="fa-solid fa-right-to-bracket text-lg"></i>
                <span class="text-lg">I already have an account</span>
            </a>
            
            <button id="view-pricing-btn" hidden class="hidden w-full bg-white/20 text-white font-semibold py-3 px-6 rounded-xl backdrop-blur-lg border border-white/30 hover:bg-white/30 transition-all duration-300 flex items-center justify-center space-x-3">
                <i class="fa-solid fa-tags text-lg"></i>
                <span>View Pricing Plans</span>
            </button>
        </div>

        <!-- Version Info -->
        <div id="version-info" class="mt-8 text-white/70 text-sm">
            <p>Version 1.0.0</p>
            <p class="mt-1">Made for Indian Kirana Stores</p>
        </div>

        <!-- Loading Animation -->
        <div id="loading-animation" class="mt-8 hidden">
            <div class="flex justify-center space-x-2">
                <div class="w-3 h-3 bg-white rounded-full animate-bounce"></div>
                <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
            <p class="text-white/90 mt-3 text-sm">Loading your store...</p>
        </div>
    </div>

    <script>
        // Buttons are plain links now (no artificial 2-second wait).
        document.getElementById('view-pricing-btn').addEventListener('click', function() {
            window.location.href = '/pricing';
        });

        // (The whole screen - buttons included - used to bob up and down forever,
        // which made the buttons hard to tap. Removed.)
    </script>

</body>
</html>
