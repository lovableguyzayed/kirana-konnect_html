<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No internet - Kirana Konnect</title>
    <meta name="theme-color" content="#4CAF50">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F7F5;
               color: #1F2933; font: 17px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        .card { max-width: 360px; }
        .ic { width: 84px; height: 84px; border-radius: 50%; background: #E8F5E9; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        h1 { font-size: 22px; margin: 0 0 6px; } p { color: #52606D; margin: 0 0 4px; }
        button { margin-top: 20px; width: 100%; min-height: 54px; border: 0; border-radius: 12px; background: #2E7D32; color: #fff; font-size: 17px; font-weight: 700; }
    </style>
</head>
<body>
<div class="card">
    <div class="ic" aria-hidden="true">📶</div>
    <h1>No internet</h1>
    <p>इंटरनेट नहीं है।</p>
    <p>Check mobile data or Wi-Fi. Your saved bills and stock are safe.</p>
    <button onclick="location.reload()">Retry · फिर कोशिश करें</button>
</div>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
